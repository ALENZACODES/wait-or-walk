name: Copy TTC subway alerts
# Every 30 minutes, copy the TTC's open GTFS Realtime subway alerts (Open Government Licence Toronto) into
# data/live_alerts.json so the page can read them from its own site, and log first and last seen times per alert in
# data/alert_history.json, plus elevator and escalator alerts in data/access_alerts.json. Commits only when the alerts
# changed, and saves the forecast for each new alert at that time in data/alert_forecasts.jsonl (scripts/log_forecasts.mjs),
# to be scored later, and counts the alerts first seen since the parser freeze in data/parser_fresh.json
# (scripts/parser_fresh.mjs). These automated commits change only those five files.
# Triggers: this schedule, a second schedule at a different offset in alerts-backup.yml, a self restarting relay in
# alerts-chain.yml (GitHub can delay or drop
# scheduled runs, so two independent schedules make a missed copy less likely), and by hand.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gtfs-realtime-bindings==1.0.0
      - run: python scripts/fetch_alerts.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/log_forecasts.mjs
      - run: node scripts/check_forecast_log.mjs
      - run: node scripts/parser_fresh.mjs
      - name: Commit if the alerts changed
        run: |
          if git diff --quiet -- data/live_alerts.json data/alert_history.json data/access_alerts.json data/alert_forecasts.jsonl data/parser_fresh.json; then echo "No change"; exit 0; fi
          git config user.name "John Khan"
          git config user.email "309250657+ALENZACODES@users.noreply.github.com"
          git add data/live_alerts.json data/alert_history.json data/access_alerts.json data/alert_forecasts.jsonl data/parser_fresh.json
          git commit -m "Copy TTC subway alerts"
          git pull --rebase origin main
          git push origin HEAD:main
